name: BJJ Note Update Mirror

on:
  push:
    branches:
      - main
    paths:
      - "bjjnote-update/source.json"
      - ".github/workflows/bjjnote-update-mirror.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bjjnote-update-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mirror repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read source
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = require('./bjjnote-update/source.json');
          const out = [];
          out.push(`EXPECTED_VERSION=${source.expectedVersion}`);
          if (source.apkSourceUrl && source.manifestSourceUrl) {
            out.push('SOURCE_MODE=direct');
            out.push(`APK_SOURCE_URL=${source.apkSourceUrl}`);
            out.push(`MANIFEST_SOURCE_URL=${source.manifestSourceUrl}`);
          } else if (source.sourceUrl) {
            out.push('SOURCE_MODE=artifact');
            out.push(`SOURCE_URL=${source.sourceUrl}`);
          } else {
            throw new Error('No updater source URL configured.');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, out.join('\n') + '\n');
          NODE

      - name: Download private release through one-time bridge URL
        run: |
          set -euo pipefail
          rm -rf /tmp/bjjnote-update
          mkdir -p /tmp/bjjnote-update
          if [ "$SOURCE_MODE" = "direct" ]; then
            curl --fail --location --retry 3 --retry-delay 2 "$APK_SOURCE_URL" -o /tmp/bjjnote-update/bjjnote-update.apk
            curl --fail --location --retry 3 --retry-delay 2 "$MANIFEST_SOURCE_URL" -o /tmp/bjjnote-update/latest.json
          else
            curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/bjjnote-update.zip
            unzip -t /tmp/bjjnote-update.zip
            unzip -o /tmp/bjjnote-update.zip -d /tmp/bjjnote-update
          fi

      - name: Publish stable public updater files
        run: |
          set -euo pipefail
          APK="$(find /tmp/bjjnote-update -type f -name 'bjjnote-update.apk' -print -quit)"
          MANIFEST="$(find /tmp/bjjnote-update -type f -name 'latest.json' -print -quit)"
          test -n "$APK"
          test -n "$MANIFEST"
          test -s "$APK"
          test -s "$MANIFEST"
          mkdir -p bjjnote-update
          cp "$APK" bjjnote-update/bjjnote.apk
          cp "$MANIFEST" bjjnote-update/latest.json
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = 'bjjnote-update/latest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expected = process.env.EXPECTED_VERSION;
          if (manifest.version !== expected) {
            throw new Error(`artifact version ${manifest.version} != expected ${expected}`);
          }
          const apk = fs.readFileSync('bjjnote-update/bjjnote.apk');
          manifest.apkUrl = 'https://raw.githubusercontent.com/hyunahch/dc_reports/main/bjjnote-update/bjjnote.apk';
          manifest.sha256 = crypto.createHash('sha256').update(apk).digest('hex');
          manifest.mirroredAt = new Date().toISOString();
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          fs.writeFileSync('bjjnote-update/mirror-status.json', JSON.stringify({
            status: 'ready',
            version: manifest.version,
            versionCode: manifest.versionCode,
            apkUrl: manifest.apkUrl,
            sha256: manifest.sha256,
            mirroredAt: manifest.mirroredAt,
          }, null, 2) + '\n');
          NODE

      - name: Commit public update channel
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bjjnote-update/bjjnote.apk bjjnote-update/latest.json bjjnote-update/mirror-status.json
          if git diff --cached --quiet; then
            echo "Public update mirror already current."
          else
            git commit -m "Mirror BJJ Note v$EXPECTED_VERSION updater"
            git push origin HEAD:main
          fi
