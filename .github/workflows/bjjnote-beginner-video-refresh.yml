name: BJJ Note Beginner Video Refresh

on:
  schedule:
    - cron: '20 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public content repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YouTube metadata tool
        run: python -m pip install --upgrade yt-dlp

      - name: Refresh beginner competition video candidates
        run: python scripts/refresh_bjjnote_beginner_videos.py

      - name: Commit refreshed feed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bjjnote-content/beginner-competition-videos.json
          if git diff --cached --quiet; then
            echo "No safe new videos found; feed unchanged."
          else
            git commit -m "Refresh BJJ beginner competition videos"
            git push
          fi
